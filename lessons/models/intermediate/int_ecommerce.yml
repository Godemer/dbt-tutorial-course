version: 2

models:
  - name: int_ecommerce__order_items_products
    description: "Order item data joined to product data"
    columns:
      - name: order_item_id
        description: ""
        tests:
          - not_null
          - unique

      - name: order_id
        description: ""
        tests:
          - not_null

      - name: user_id
        description: ""
        tests:
          - not_null

      - name: product_id
        description: ""
        tests:
          - not_null

      - name: item_sale_price
        description: "How mutch the item sold for"
        tests:
          - not_null

      - name: product_department
        description: "Whether the product is menswear or womeswear"

      - name: product_cost
        description: "How mutch the product cost the business to purchase"

      - name: product_retail_price
        description: "How mutch the product retials for on the online store"

      - name: item_profit
        description: ""
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "= (item_sale_price - product_cost)"
              severity: error

      - name: item_discount
        description: "product_retail_price minus item_sale_price"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "= (product_retail_price - item_sale_price)"
              severity: error